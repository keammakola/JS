<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Icebreaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        display: ['DM Serif Display', 'serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#f7f7f2] text-[#20231d] font-sans antialiased min-h-screen overflow-x-hidden">
    <main class="min-h-screen flex flex-col">
        <header class="w-full px-4 sm:px-8 py-4 sm:py-5 flex items-center justify-between">
            <a href="./index.html" class="flex items-center gap-2.5" aria-label="Audience Icebreaker home">
                <span class="w-9 h-9 rounded-full bg-[#24271f] text-white flex items-center justify-center text-lg" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="font-bold tracking-tight">Icebreaker</span>
            </a>
            <span class="rounded-full border border-[#d8dacd] bg-white/70 px-2.5 sm:px-3 py-1.5 text-[11px] sm:text-xs font-bold text-[#777b6d]">
                3 questions
            </span>
        </header>

        <section class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-8 pb-7 sm:pb-10 lg:px-12 lg:pb-12 flex items-center justify-center">
            <div class="max-w-xl mx-auto text-center pt-3 sm:pt-6 lg:pt-0">
                <div class="inline-flex items-center gap-2 rounded-full border border-[#dde2d3] bg-[#f1f3ea] px-3.5 py-2 text-xs font-bold uppercase tracking-[0.14em] text-[#58644b] mb-5 sm:mb-6">
                    <span class="w-2 h-2 rounded-full bg-[#71825e]"></span>
                    Quick audience poll
                </div>

                <h1 class="font-display text-[clamp(2.75rem,13vw,6.75rem)] leading-[0.88] tracking-[-0.035em] text-[#20231d]">
                    Share your<br>
                    <span class="text-[#71825e]">favourites.</span>
                </h1>

                <p class="mt-5 sm:mt-6 text-[15px] sm:text-lg leading-6 sm:leading-7 text-[#686c60] max-w-sm mx-auto">
                    Three quick questions. One simple way to see what the room is thinking.
                </p>

                <p class="mt-6 sm:mt-8 text-xs sm:text-sm leading-5 text-[#888b7f]">
                    By clicking Continue, you agree to the <a href="./terms.html" class="font-semibold text-[#58644b] underline underline-offset-2 hover:text-[#34382e] focus:outline-none focus:ring-2 focus:ring-[#71825e] focus:ring-offset-2 rounded-sm">terms</a> of this site.
                </p>
                <div class="mt-3 flex flex-col sm:flex-row items-center justify-center gap-3">
                    <a id="continue-btn" href="./interactive_audience_poll.html"
                        class="group w-full sm:w-auto min-w-52 inline-flex items-center justify-between gap-8 rounded-full bg-[#24271f] px-6 py-4 text-base font-bold text-white shadow-[0_12px_30px_rgba(36,39,31,0.16)] transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#34382e] hover:shadow-[0_16px_34px_rgba(36,39,31,0.22)] focus:outline-none focus:ring-4 focus:ring-[#bcc4ae] focus:ring-offset-2">
                        <span>Continue</span>
                        <span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                <path d="M4 10h11M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </a>
                    <span class="text-sm font-semibold text-[#888b7f]">Takes about 10 seconds</span>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
